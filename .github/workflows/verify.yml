name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: extractions/setup-just@v3
      - name: Check syntax
        run: just lint
      - name: Run the tests
        run: just test
      - name: Check the links to skills of other packages with the jnterfaces checker
        run: |
          git clone --quiet https://github.com/rahuldave/jnterfaces "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet 0b115f09edfc9c2ffb83733fcb07c491b709eec4
          just links "$RUNNER_TEMP/jnterfaces"
      - name: Validate package manifest with skill-package-maker
        run: just package-lint
